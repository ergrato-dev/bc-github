<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Repo hilo conductor — estado de la plataforma</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0d1117;
        color: #f0f6fc;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 40rem; padding: 2rem; }
      h1 { font-size: 1.75rem; margin: 0 0 0.5rem; }
      p { color: #8b949e; line-height: 1.6; }
      dl { display: grid; grid-template-columns: auto 1fr; gap: 0.5rem 1rem; margin-top: 2rem; }
      dt { color: #8b949e; }
      dd { margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #58a6ff; }
    </style>
  </head>
  <body>
    <main>
      <h1>Plataforma operativa</h1>
      <p>
        Esta página la publica un workflow de GitHub Actions: se construye una
        vez, se valida como artefacto y se despliega tras pasar por una puerta
        con revisor. Cámbiala por lo que quieras contar de tu proyecto.
      </p>
      <dl>
        <dt>Versión desplegada</dt>
        <dd>__VERSION__</dd>
        <dt>Publicado</dt>
        <dd>__FECHA__</dd>
      </dl>
    </main>
  </body>
</html>
