# Semana 10 — Práctica 02
#
# Composite action: se ejecuta DENTRO del job de quien la llama, en su runner.
# Recuerda las cuatro reglas:
#   1. todo `run:` lleva `shell:`
#   2. los inputs son cadenas: se comparan con == 'true'
#   3. no existe el contexto `secrets`: los tokens se pasan como input
#   4. los outputs se mapean a mano desde un step con `id:`

name: Preparar entorno
description: Instala Node y las dependencias del proyecto, con caché
author: tu-usuario

# ------------------------------------------------------------------- PASO 1
# Descomenta y ajusta al gestor de paquetes que uses de verdad.
#
# inputs:
#   node-version:
#     description: Versión de Node
#     required: false
#     default: "24"
#   instalar:
#     description: Si se ejecuta la instalación de dependencias
#     required: false
#     default: "true"
#
# outputs:
#   cache-hit:
#     description: Si la caché de dependencias acertó
#     value: ${{ steps.node.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - id: node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "24"        # ← PASO 1: ${{ inputs.node-version }}
        cache: npm

    # PASO 1 — añade la condición cuando tengas el input:
    #   if: ${{ inputs.instalar == 'true' }}
    - shell: bash                  # ← obligatorio en composite actions
      run: npm ci
