    <text class="t chip" x="269" y="20" text-anchor="middle">Rulesets</text>

    <rect class="card" x="326" y="0" width="106" height="30" rx="15"/>
    <text class="t chip" x="379" y="20" text-anchor="middle">Seguridad</text>

    <rect class="card" x="442" y="0" width="82"  height="30" rx="15"/>
