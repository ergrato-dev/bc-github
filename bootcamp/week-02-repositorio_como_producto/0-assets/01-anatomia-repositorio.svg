<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="Anatomía de un repositorio: archivos que GitHub trata de forma especial en la raíz y en la carpeta .github, y dónde aparece cada uno en la interfaz">
  <title>Archivos que GitHub trata de forma especial</title>
  <style>
    .bg   { fill: #0d1117; }
    .box  { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
    .acc  { fill: #161b22; stroke: #58a6ff; stroke-width: 2; }
    .t    { font-family: Inter, Roboto, "Segoe UI", system-ui, sans-serif; }
    .h    { font-size: 15px; font-weight: 600; fill: #f0f6fc; }
    .f    { font-size: 12px; font-weight: 600; fill: #58a6ff; }
    .s    { font-size: 12px; fill: #8b949e; }
    .cap  { font-size: 13px; font-weight: 600; fill: #f0f6fc; }
  </style>

  <rect class="bg" width="800" height="420"/>

  <text class="t h" x="40" y="40">Qué hace GitHub con cada archivo</text>
  <text class="t s" x="40" y="62">Todos pueden vivir en la raíz o en .github/ — GitHub los busca en ambos sitios.</text>

  <!-- columna izquierda: archivos -->
  <rect class="acc" x="40" y="86" width="330" height="290" rx="8"/>
  <text class="t cap" x="60" y="112">Archivos reconocidos</text>

  <text class="t f" x="60" y="146">README.md</text>
  <text class="t f" x="60" y="176">LICENSE</text>
  <text class="t f" x="60" y="206">CONTRIBUTING.md</text>
  <text class="t f" x="60" y="236">CODE_OF_CONDUCT.md</text>
  <text class="t f" x="60" y="266">SECURITY.md</text>
  <text class="t f" x="60" y="296">CODEOWNERS</text>
  <text class="t f" x="60" y="326">.github/ISSUE_TEMPLATE/</text>
  <text class="t f" x="60" y="356">FUNDING.yml</text>

  <!-- columna derecha: efecto -->
  <rect class="box" x="410" y="86" width="350" height="290" rx="8"/>
  <text class="t cap" x="430" y="112">Dónde aparece</text>

  <text class="t s" x="430" y="146">Portada del repositorio</text>
  <text class="t s" x="430" y="176">Barra lateral · detección de licencia</text>
  <text class="t s" x="430" y="206">Enlace al abrir issue o PR</text>
  <text class="t s" x="430" y="236">Barra lateral · perfil de comunidad</text>
  <text class="t s" x="430" y="266">Pestaña Security · reporte privado</text>
  <text class="t s" x="430" y="296">Revisores automáticos del PR</text>
  <text class="t s" x="430" y="326">Formularios al crear un issue</text>
  <text class="t s" x="430" y="356">Botón Sponsor</text>

  <text class="t s" x="40" y="404">Un repositorio llamado .github en tu cuenta aporta estos archivos por defecto a todos tus repos.</text>
</svg>
