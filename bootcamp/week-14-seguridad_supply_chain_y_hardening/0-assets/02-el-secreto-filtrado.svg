<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" aria-label="Dos caminos para un secreto en un commit. Arriba, push protection rechaza el push y el secreto nunca llega a GitHub. Abajo, si el secreto entra, la respuesta tiene cuatro pasos en orden: revocar, emitir una credencial nueva, evaluar el alcance y limpiar la historia.">
  <title>El secreto bloqueado y el secreto filtrado</title>
  <style>
    .bg   { fill: #0d1117; }
    .surf { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
    .ok   { fill: #0d1117; stroke: #3fb950; stroke-width: 1.5; }
    .warn { fill: #0d1117; stroke: #d29922; stroke-width: 1.5; }
    .bad  { fill: #0d1117; stroke: #f85149; stroke-width: 1.5; }
    .t    { font-family: Inter, Roboto, "Segoe UI", system-ui, sans-serif; }
    .h    { font-size: 15px; font-weight: 600; fill: #f0f6fc; }
    .cap  { font-size: 13px; font-weight: 600; fill: #f0f6fc; }
    .s    { font-size: 11px; fill: #8b949e; }
    .good { font-size: 11px; fill: #3fb950; }
    .warnt{ font-size: 11px; fill: #d29922; }
    .err  { font-size: 11px; fill: #f85149; }
    .num  { font-size: 12px; font-weight: 600; fill: #58a6ff; }
    .lbl  { font-size: 11px; fill: #8b949e; }
    .eg   { stroke: #3fb950; stroke-width: 2; fill: none; }
    .ey   { stroke: #d29922; stroke-width: 2; fill: none; }
    .er   { stroke: #f85149; stroke-width: 2; fill: none; }
    .sep  { stroke: #30363d; stroke-width: 1.5; stroke-dasharray: 5 5; }
  </style>

  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/>
    </marker>
    <marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#d29922"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f85149"/>
    </marker>
  </defs>

  <rect class="bg" width="880" height="430"/>
  <text class="t h" x="25" y="34">El mismo commit, dos finales</text>

  <text class="t good" x="25" y="66">CON PUSH PROTECTION · el secreto nunca existe en GitHub</text>

  <rect class="surf" x="25" y="80" width="170" height="58" rx="8"/>
  <text class="t cap" x="38" y="104">Commit local</text>
  <text class="t s"   x="38" y="122">con la credencial</text>

  <line class="eg" x1="195" y1="109" x2="233" y2="109" marker-end="url(#ag)"/>

  <rect class="ok" x="237" y="80" width="180" height="58" rx="8"/>
  <text class="t cap" x="250" y="104">git push</text>
  <text class="t s"   x="250" y="122">rechazado en el servidor</text>

  <line class="eg" x1="417" y1="109" x2="455" y2="109" marker-end="url(#ag)"/>

  <rect class="ok" x="459" y="80" width="180" height="58" rx="8"/>
  <text class="t cap" x="472" y="104">Cero alertas</text>
  <text class="t s"   x="472" y="122">no hay nada que rotar</text>

  <line class="sep" x1="25" y1="168" x2="855" y2="168"/>

  <text class="t err" x="25" y="196">SI ENTRA · el orden de la respuesta, y no es el intuitivo</text>

  <rect class="bad" x="25" y="212" width="170" height="58" rx="8"/>
  <text class="t cap" x="38" y="236">Secreto publicado</text>
  <text class="t s"   x="38" y="254">tratarlo por comprometido</text>

  <line class="er" x1="195" y1="241" x2="233" y2="241" marker-end="url(#ar)"/>

  <rect class="warn" x="237" y="212" width="145" height="58" rx="8"/>
  <text class="t num" x="250" y="234">1</text>
  <text class="t cap" x="268" y="234">Revocar</text>
  <text class="t s"   x="250" y="254">en el proveedor</text>

  <line class="ey" x1="382" y1="241" x2="410" y2="241" marker-end="url(#ay)"/>

  <rect class="warn" x="414" y="212" width="145" height="58" rx="8"/>
  <text class="t num" x="427" y="234">2</text>
  <text class="t cap" x="445" y="234">Emitir</text>
  <text class="t s"   x="427" y="254">con menos permisos</text>

  <line class="ey" x1="559" y1="241" x2="587" y2="241" marker-end="url(#ay)"/>

  <rect class="warn" x="591" y="212" width="145" height="58" rx="8"/>
  <text class="t num" x="604" y="234">3</text>
  <text class="t cap" x="622" y="234">Evaluar</text>
  <text class="t s"   x="604" y="254">¿se usó, y cuánto?</text>

  <line class="ey" x1="736" y1="241" x2="783" y2="241"/>

  <rect class="warn" x="710" y="292" width="145" height="58" rx="8"/>
  <text class="t num" x="723" y="314">4</text>
  <text class="t cap" x="741" y="314">Limpiar</text>
  <text class="t s"   x="723" y="334">historia y prevención</text>

  <path class="ey" d="M783 241 L783 288" marker-end="url(#ay)"/>

  <rect class="surf" x="25" y="292" width="660" height="58" rx="8"/>
  <text class="t cap"   x="38" y="316">Reescribir la historia no elimina el secreto de GitHub</text>
  <text class="t s"     x="38" y="336">Los forks no se reescriben · los clones ya están fuera · los commits siguen siendo accesibles por su SHA</text>

  <text class="t lbl" x="25" y="396">Por eso el paso 1 es revocar: es lo único que reduce el riesgo. Limpiar es higiene, y va al final.</text>
</svg>
