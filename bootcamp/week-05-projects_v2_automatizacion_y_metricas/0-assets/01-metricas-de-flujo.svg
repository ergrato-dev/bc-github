<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Lead time y cycle time sobre la vida de un item: el lead time va desde que se crea hasta que se cierra, el cycle time solo desde que se empieza, y la diferencia entre ambos es el tiempo en backlog">
  <title>Lead time, cycle time y WIP</title>
  <style>
    .bg   { fill: #0d1117; }
    .box  { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
    .t    { font-family: Inter, Roboto, "Segoe UI", system-ui, sans-serif; }
    .h    { font-size: 15px; font-weight: 600; fill: #f0f6fc; }
    .cap  { font-size: 13px; font-weight: 600; fill: #f0f6fc; }
    .s    { font-size: 12px; fill: #8b949e; }
    .axis { stroke: #30363d; stroke-width: 1.5; }
    .lead { stroke: #58a6ff; stroke-width: 3; }
    .cyc  { stroke: #3fb950; stroke-width: 3; }
    .wait { stroke: #d29922; stroke-width: 3; stroke-dasharray: 5 4; }
    .lblb { font-size: 12px; font-weight: 600; fill: #58a6ff; }
    .lblg { font-size: 12px; font-weight: 600; fill: #3fb950; }
    .lbly { font-size: 12px; font-weight: 600; fill: #d29922; }
    .dot  { fill: #f0f6fc; }
  </style>

  <rect class="bg" width="800" height="400"/>
  <text class="t h" x="40" y="40">La vida de un item, y qué mide cada métrica</text>

  <!-- eje -->
  <line class="axis" x1="80" y1="200" x2="740" y2="200"/>
  <circle class="dot" cx="120" cy="200" r="5"/>
  <circle class="dot" cx="380" cy="200" r="5"/>
  <circle class="dot" cx="680" cy="200" r="5"/>

  <text class="t s" x="120" y="228" text-anchor="middle">se crea</text>
  <text class="t s" x="120" y="246" text-anchor="middle">(issue abierto)</text>
  <text class="t s" x="380" y="228" text-anchor="middle">se empieza</text>
  <text class="t s" x="380" y="246" text-anchor="middle">(Status = En curso)</text>
  <text class="t s" x="680" y="228" text-anchor="middle">se cierra</text>
  <text class="t s" x="680" y="246" text-anchor="middle">(entregado)</text>

  <!-- espera -->
  <line class="wait" x1="120" y1="160" x2="380" y2="160"/>
  <text class="t lbly" x="250" y="150" text-anchor="middle">espera en backlog</text>

  <!-- cycle -->
  <line class="cyc" x1="380" y1="120" x2="680" y2="120"/>
  <text class="t lblg" x="530" y="110" text-anchor="middle">cycle time — lo que controla el equipo</text>

  <!-- lead -->
  <line class="lead" x1="120" y1="80" x2="680" y2="80"/>
  <text class="t lblb" x="400" y="70" text-anchor="middle">lead time — lo que percibe quien lo pidió</text>

  <!-- cajas -->
  <rect class="box" x="40" y="284" width="350" height="86" rx="8"/>
  <text class="t cap" x="60" y="308">Ley de Little</text>
  <text class="t s" x="60" y="332">lead time ≈ WIP / throughput</text>
  <text class="t s" x="60" y="354">Para entregar antes: empieza menos cosas a la vez.</text>

  <rect class="box" x="410" y="284" width="350" height="86" rx="8"/>
  <text class="t cap" x="430" y="308">Cómo leerlo</text>
  <text class="t s" x="430" y="332">Lead alto + cycle bajo = se tarda en empezar.</text>
  <text class="t s" x="430" y="354">Lead alto + cycle alto = se atasca una vez empezado.</text>
</svg>
