# ============================================================
# release.yml — el PR de release y el release
# ============================================================
# Se completa en la Práctica 02.
#
# Corre en cada push a main. Casi siempre solo actualiza un pull request;
# cuando ese pull request se fusiona, crea el tag y el release.
#
# El GITHUB_TOKEN de este workflow se queda en `contents: read`: quien
# escribe es el token fine-grained de RELEASE_PLEASE_TOKEN, no el del run.
# ============================================================

name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Dos releases a la vez dejarían el manifiesto en un estado incoherente.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Calcular versión y publicar
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # ============================================
    # PASO 4: exponer el resultado a otros workflows
