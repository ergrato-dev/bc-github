  </g>

  <text class="t title" x="200" y="94">Bootcamp GitHub</text>
  <text class="t sub"   x="200" y="126">Zero to Master — GitHub como plataforma de ingeniería</text>
  <text class="t meta"  x="200" y="154">21 semanas · 168 horas · 8 h/semana · autoestudio</text>

  <g transform="translate(200, 180)">
