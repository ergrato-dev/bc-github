      #     if [ "${{ steps.rp.outputs.release_created }}" = "true" ]; then
      #       echo "Publicado ${{ steps.rp.outputs.tag_name }}" >> "$GITHUB_STEP_SUMMARY"
      #     else
      #       echo "Sin release: el PR de release sigue abierto o no hay nada que publicar." >> "$GITHUB_STEP_SUMMARY"
      #     fi

