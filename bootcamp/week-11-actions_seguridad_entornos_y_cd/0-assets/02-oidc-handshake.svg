<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="Intercambio OIDC: el job con permiso id-token write pide un JWT al emisor de GitHub, se lo entrega al proveedor cloud, el proveedor valida firma, audiencia y subject contra su política de confianza y devuelve una credencial temporal; no hay ningún secreto almacenado">
  <title>El intercambio OIDC entre un job y un proveedor externo</title>
  <style>
    .bg   { fill: #0d1117; }
    .surf { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
    .inner{ fill: #0d1117; stroke: #30363d; stroke-width: 1; }
    .hi   { fill: #0d1117; stroke: #58a6ff; stroke-width: 1.5; }
    .ok   { fill: #0d1117; stroke: #3fb950; stroke-width: 1.5; }
    .t    { font-family: Inter, Roboto, "Segoe UI", system-ui, sans-serif; }
    .h    { font-size: 15px; font-weight: 600; fill: #f0f6fc; }
    .cap  { font-size: 13px; font-weight: 600; fill: #f0f6fc; }
    .s    { font-size: 12px; fill: #8b949e; }
    .lbl  { font-size: 11px; fill: #8b949e; }
    .good { font-size: 11px; fill: #3fb950; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 11px; fill: #58a6ff; }
    .e    { stroke: #30363d; stroke-width: 2; fill: none; }
    .eb   { stroke: #58a6ff; stroke-width: 2; fill: none; }
    .eg   { stroke: #3fb950; stroke-width: 2; fill: none; }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#30363d"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/>
    </marker>
  </defs>

  <rect class="bg" width="880" height="420"/>
  <text class="t h" x="40" y="36">Identidad firmada en el momento, en vez de una clave guardada</text>

  <!-- Job -->
  <rect class="hi" x="40" y="70" width="220" height="120" rx="8"/>
  <text class="t cap"  x="60" y="96">Job del workflow</text>
  <text class="t mono" x="60" y="118">permissions:</text>
  <text class="t mono" x="60" y="134">  id-token: write</text>
  <text class="t lbl"  x="60" y="158">environment: production</text>
  <text class="t lbl"  x="60" y="176">(añade el claim environment)</text>

  <!-- Emisor -->
  <rect class="surf" x="330" y="70" width="220" height="120" rx="8"/>
  <text class="t cap"  x="350" y="96">Emisor de GitHub</text>
  <text class="t mono" x="350" y="118">token.actions.</text>
  <text class="t mono" x="350" y="134">githubusercontent.com</text>
  <text class="t lbl"  x="350" y="158">Firma un JWT que describe</text>
  <text class="t lbl"  x="350" y="176">repo, ref, environment…</text>

  <!-- Proveedor -->
  <rect class="surf" x="620" y="70" width="220" height="120" rx="8"/>
  <text class="t cap" x="640" y="96">Proveedor cloud</text>
  <text class="t lbl" x="640" y="118">Valida firma y audiencia</text>
  <text class="t lbl" x="640" y="136">y compara el sub con su</text>
  <text class="t lbl" x="640" y="154">política de confianza</text>
  <text class="t mono" x="640" y="176">sts:AssumeRoleWithWebIdentity</text>

  <path class="e"  d="M260 112 H322" marker-end="url(#a)"/>
  <text class="t lbl" x="262" y="104">1. pide token (aud)</text>

  <path class="eb" d="M322 152 H262" marker-end="url(#ab)"/>
  <text class="t mono" x="266" y="172">2. JWT firmado</text>

  <path class="e" d="M550 112 H612" marker-end="url(#a)"/>
  <text class="t lbl" x="556" y="104">3. entrega el JWT</text>

  <path class="eg" d="M612 152 H552" marker-end="url(#ag)"/>
  <text class="t good" x="556" y="172">4. credencial temporal</text>

  <!-- Claims -->
  <rect class="inner" x="40" y="220" width="400" height="160" rx="8"/>
  <text class="t cap"  x="60" y="246">Lo que va dentro del JWT</text>
  <text class="t mono" x="60" y="272">sub: repo:OWNER/REPO:environment:production</text>
  <text class="t mono" x="60" y="292">aud: sts.amazonaws.com</text>
  <text class="t mono" x="60" y="312">repository · ref · workflow_ref</text>
  <text class="t mono" x="60" y="332">job_workflow_ref · runner_environment</text>
  <text class="t lbl"  x="60" y="360">El payload no está cifrado: la garantía es la firma.</text>

  <!-- Condición -->
  <rect class="ok" x="470" y="220" width="370" height="160" rx="8"/>
  <text class="t cap"  x="490" y="246">La condición estrecha</text>
  <text class="t mono" x="490" y="272">"…:aud": "sts.amazonaws.com"</text>
  <text class="t mono" x="490" y="292">"…:sub": "repo:OWNER/REPO:</text>
  <text class="t mono" x="490" y="308">          environment:production"</text>
  <text class="t good" x="490" y="336">Nada que rotar, nada que filtrar:</text>
  <text class="t good" x="490" y="354">la credencial caduca en minutos.</text>
  <text class="t lbl"  x="490" y="372">Con sub: repo:OWNER/REPO:* despliega cualquier rama.</text>
</svg>
