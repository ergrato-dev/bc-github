<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="Inter, Roboto, system-ui, sans-serif">
  <rect width="880" height="460" fill="#0d1117"/>

  <text x="440" y="38" fill="#f0f6fc" font-size="22" font-weight="700" text-anchor="middle">La misma pregunta, dos APIs</text>
  <text x="440" y="62" fill="#8b949e" font-size="14" text-anchor="middle">«Los issues abiertos con su autor y sus labels»</text>

  <!-- REST -->
  <rect x="40" y="90" width="380" height="330" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="70" y="122" fill="#58a6ff" font-size="17" font-weight="700">REST</text>
  <text x="70" y="144" fill="#8b949e" font-size="13">Un recurso, una URL</text>

  <rect x="70" y="164" width="320" height="34" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="84" y="186" fill="#f0f6fc" font-size="12.5">GET /repos/OWNER/REPO/issues</text>

  <rect x="70" y="208" width="320" height="34" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="84" y="230" fill="#f0f6fc" font-size="12.5">GET /repos/OWNER/REPO/issues/1/labels</text>

  <rect x="70" y="252" width="320" height="34" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="84" y="274" fill="#f0f6fc" font-size="12.5">GET /repos/OWNER/REPO/issues/2/labels</text>

  <text x="230" y="308" fill="#8b949e" font-size="13" text-anchor="middle">… una llamada más por cada issue</text>

  <rect x="70" y="326" width="320" height="66" rx="6" fill="#0d1117" stroke="#f85149"/>
  <text x="84" y="350" fill="#f85149" font-size="13" font-weight="700">1 + N peticiones</text>
  <text x="84" y="372" fill="#8b949e" font-size="12.5">120 campos por respuesta, usas 3</text>

  <!-- GraphQL -->
  <rect x="460" y="90" width="380" height="330" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="490" y="122" fill="#58a6ff" font-size="17" font-weight="700">GraphQL</text>
  <text x="490" y="144" fill="#8b949e" font-size="13">Una consulta, la forma que pediste</text>

  <rect x="490" y="164" width="320" height="122" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="504" y="186" fill="#f0f6fc" font-size="12.5">repository(owner:…, name:…) {</text>
  <text x="518" y="206" fill="#f0f6fc" font-size="12.5">issues(first: 100, states: OPEN) {</text>
  <text x="532" y="226" fill="#f0f6fc" font-size="12.5">nodes {</text>
  <text x="546" y="246" fill="#3fb950" font-size="12.5">number  author { login }</text>
  <text x="546" y="266" fill="#3fb950" font-size="12.5">labels(first: 10) { nodes { name } }</text>
  <text x="504" y="286" fill="#f0f6fc" font-size="12.5">} } }</text>

  <text x="650" y="308" fill="#8b949e" font-size="13" text-anchor="middle">todo en el mismo viaje</text>

  <rect x="490" y="326" width="320" height="66" rx="6" fill="#0d1117" stroke="#3fb950"/>
  <text x="504" y="350" fill="#3fb950" font-size="13" font-weight="700">1 petición · cost: 1</text>
  <text x="504" y="372" fill="#8b949e" font-size="12.5">solo los campos que pediste</text>

  <text x="440" y="440" fill="#d29922" font-size="13" text-anchor="middle">Rulesets, Actions y las alertas solo están en REST · Projects v2 y Discussions solo en GraphQL</text>
</svg>
