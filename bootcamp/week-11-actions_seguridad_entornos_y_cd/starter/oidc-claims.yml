# ============================================================
# Semana 11 — Leer los claims de un token OIDC
# ============================================================
# Este workflow no despliega nada. Pide un token de identidad
# a GitHub y enseña lo que lleva dentro, que es lo que tendrás
# que condicionar en el proveedor cloud.
#
# id-token: write NO da permisos sobre el repositorio: solo
# permite pedir el token. Lo que ese token abra lo decide el
# otro lado.
# ============================================================

name: Claims OIDC

on:
  workflow_dispatch:
    inputs:
      audiencia:
        description: Audiencia (aud) que se pide para el token
        type: string
        required: false
        default: bc-github

permissions:
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
