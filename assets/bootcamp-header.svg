<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" role="img" aria-label="Bootcamp GitHub Zero to Master">
  <title>Bootcamp GitHub — Zero to Master</title>
  <style>
