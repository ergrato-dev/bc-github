<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-label="Grafo de commits: la rama main y una rama feature apuntando a commits, con HEAD apuntando a feature">
  <title>Grafo de commits, ramas y HEAD</title>
  <style>
    .bg    { fill: #0d1117; }
    .t     { font-family: Inter, Roboto, "Segoe UI", system-ui, sans-serif; }
    .h     { font-size: 15px; font-weight: 600; fill: #f0f6fc; }
    .s     { font-size: 12px; fill: #8b949e; }
    .sha   { font-size: 12px; font-weight: 600; fill: #0d1117; }
    .node  { fill: #58a6ff; stroke: #1f6feb; stroke-width: 1.5; }
    .node2 { fill: #a371f7; stroke: #8957e0; stroke-width: 1.5; }
    .edge  { stroke: #30363d; stroke-width: 2; fill: none; }
    .ref   { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
    .reft  { font-size: 12px; font-weight: 600; fill: #f0f6fc; }
    .head  { fill: #161b22; stroke: #3fb950; stroke-width: 2; }
    .headt { font-size: 12px; font-weight: 700; fill: #3fb950; }
    .arrow { stroke: #8b949e; stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect class="bg" width="800" height="340"/>

  <text class="t h" x="40" y="42">El grafo: cada commit apunta a su padre</text>
  <text class="t s" x="40" y="64">Las flechas van hacia atrás en el tiempo. Una rama es solo un puntero a un commit.</text>

  <!-- edges main -->
  <line class="edge" x1="140" y1="180" x2="240" y2="180"/>
  <line class="edge" x1="260" y1="180" x2="360" y2="180"/>
  <line class="edge" x1="380" y1="180" x2="480" y2="180"/>
  <!-- edge feature -->
  <line class="edge" x1="380" y1="168" x2="480" y2="115"/>
  <line class="edge" x1="500" y1="105" x2="600" y2="105"/>

  <!-- main commits -->
  <circle class="node" cx="120" cy="180" r="20"/>
  <text class="t sha" x="120" y="185" text-anchor="middle">a1b</text>
  <circle class="node" cx="250" cy="180" r="20"/>
  <text class="t sha" x="250" y="185" text-anchor="middle">c3d</text>
  <circle class="node" cx="370" cy="180" r="20"/>
  <text class="t sha" x="370" y="185" text-anchor="middle">e5f</text>
  <circle class="node" cx="490" cy="180" r="20"/>
  <text class="t sha" x="490" y="185" text-anchor="middle">g7h</text>

  <!-- feature commits -->
  <circle class="node2" cx="490" cy="105" r="20"/>
  <text class="t sha" x="490" y="110" text-anchor="middle">i9j</text>
  <circle class="node2" cx="610" cy="105" r="20"/>
  <text class="t sha" x="610" y="110" text-anchor="middle">k1l</text>

  <!-- refs -->
  <rect class="ref" x="530" y="228" width="118" height="30" rx="6"/>
  <text class="t reft" x="589" y="248" text-anchor="middle">refs/heads/main</text>
  <line class="arrow" x1="530" y1="235" x2="500" y2="198" marker-end="url(#a1)"/>

  <rect class="ref" x="655" y="42" width="112" height="30" rx="6"/>
  <text class="t reft" x="711" y="62" text-anchor="middle">feature/multa</text>
  <line class="arrow" x1="668" y1="72" x2="625" y2="88" marker-end="url(#a1)"/>

  <rect class="head" x="655" y="150" width="70" height="30" rx="6"/>
  <text class="t headt" x="690" y="170" text-anchor="middle">HEAD</text>
  <line class="arrow" x1="690" y1="150" x2="700" y2="80" marker-end="url(#a1)"/>

  <text class="t s" x="40" y="300">HEAD apunta a una rama, no a un commit. La rama apunta al commit.</text>
  <text class="t s" x="40" y="320">Crear una rama cuesta 41 bytes: un archivo con un SHA dentro.</text>
</svg>
